name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Validate application data
        run: python scripts/validate_data.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean ZuJiChangZheng.spec

      - name: Smoke test packaged executable
        run: python scripts/smoke_packaged.py

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $versionedExe = "dist/ZuJiChangZheng-$tag.exe"
          Copy-Item dist/ZuJiChangZheng.exe $versionedExe
          Compress-Archive -Path @('dist/ZuJiChangZheng.exe', 'README.md', 'THIRD_PARTY.md') `
            -DestinationPath "dist/ZuJiChangZheng-$tag-win64.zip" -CompressionLevel Optimal
          $files = @($versionedExe, "dist/ZuJiChangZheng-$tag-win64.zip")
          $checksums = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          }
          $checksums | Set-Content -Encoding ascii "dist/ZuJiChangZheng-$tag-SHA256SUMS.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = @"
          Windows x64 preview built from commit $env:GITHUB_SHA.

          Includes the latest learning glass fixes, background music, route animation behavior, and the completed-journey martyr memorial screen.
          "@
          $notes | Set-Content -Encoding utf8 release-notes.md
          gh release create $tag `
            "dist/ZuJiChangZheng-$tag.exe" `
            "dist/ZuJiChangZheng-$tag-win64.zip" `
            "dist/ZuJiChangZheng-$tag-SHA256SUMS.txt" `
            --title "足迹长征 $tag · Windows 预览版" `
            --notes-file release-notes.md `
            --prerelease
